<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found — Mohamed Mamdouh</title>
    <meta
      name="description"
      content="Software Engineer focused on building full-stack web applications with .NET and Angular. Explore background, skills, and projects."
    />
    <link rel="icon" type="image/svg+xml" href="/portfolio/favicon.svg" />
    <script>
      (function () {
        const stored = localStorage.getItem('theme');
        const theme =
          stored ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to content</a>
    <main id="main" class="not-found">
      <div class="container not-found__inner">
        <p class="eyebrow">404</p>
        <h1>Page not found</h1>
        <p class="text-muted">The page you're looking for doesn't exist or has moved.</p>
        <a href="/portfolio/" class="btn btn-primary">Back to Home</a>
      </div>
    </main>
    <script type="module" src="/src/not-found.ts"></script>
  </body>
</html>
